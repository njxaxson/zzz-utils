<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zenless Zone Zero agent summaries and kit descriptions">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="canonical" href="https://njxaxson.github.io/zzz-utils/character-summary.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ZZZ Utils">
    <meta property="og:title" content="ZZZ Character Summary">
    <meta property="og:description" content="Zenless Zone Zero agent summaries and kit descriptions">
    <meta property="og:url" content="https://njxaxson.github.io/zzz-utils/character-summary.html">
    <meta property="og:image" content="https://njxaxson.github.io/zzz-utils/assets/sitelogo.png">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ZZZ Character Summary">
    <meta name="twitter:description" content="Zenless Zone Zero agent summaries and kit descriptions">
    <meta name="twitter:image" content="https://njxaxson.github.io/zzz-utils/assets/sitelogo.png">
    <title>ZZZ Character Summary</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "WebPage",
                "name": "ZZZ Character Summary",
                "url": "https://njxaxson.github.io/zzz-utils/character-summary.html",
                "description": "Zenless Zone Zero agent summaries and kit descriptions",
                "inLanguage": "en",
                "about": {
                    "@type": "VideoGame",
                    "name": "Zenless Zone Zero",
                    "alternateName": "ZZZ",
                    "publisher": {
                        "@type": "Organization",
                        "name": "HoYoverse"
                    }
                },
                "author": {
                    "@type": "Person",
                    "name": "njxaxson"
                }
            },
            {
                "@type": "BreadcrumbList",
                "itemListElement": [
                    { "@type": "ListItem", "position": 1, "name": "ZZZ Utils", "item": "https://njxaxson.github.io/zzz-utils/" },
                    { "@type": "ListItem", "position": 2, "name": "Character Summary", "item": "https://njxaxson.github.io/zzz-utils/character-summary.html" }
                ]
            }
        ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        .summary-count {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .summary-count .count-num {
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        /* Card shell */
        .char-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.15s, transform 0.15s;
            min-height: 145px;
        }

        .char-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        /* Header row */
        .char-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .char-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .avatar-preview-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 1px 4px;
            border-radius: 3px;
            background: var(--accent-secondary);
            color: var(--bg-primary);
            line-height: 1.2;
        }

        .char-avatar {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .char-card.element-fire .char-avatar { border-color: var(--element-fire); }
        .char-card.element-ice .char-avatar { border-color: var(--element-ice); }
        .char-card.element-electric .char-avatar { border-color: var(--element-electric); }
        .char-card.element-physical .char-avatar { border-color: var(--element-physical); }
        .char-card.element-ether .char-avatar { border-color: var(--element-ether); }
        .char-card.element-wind .char-avatar { border-color: var(--element-wind); }

        .char-identity { flex: 1; min-width: 0; }

        .char-name-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .char-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Titled badge */
        .titled-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Titled card gets a subtle glow on hover */
        .char-card.titled:hover {
            box-shadow: 0 0 12px rgba(0, 212, 170, 0.25);
        }

        .char-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 0.15rem;
        }

        .char-subtitle .rank-s { color: var(--accent-primary); font-weight: 700; }
        .char-subtitle .rank-a { color: var(--element-ether); font-weight: 700; }

        /* Tier indicator — plain text, no border/background */
        .tier-indicator {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .tier-indicator.tier-elite { color: var(--text-primary); }
        .tier-indicator.tier-top   { color: var(--text-primary); }
        .tier-indicator.tier-good  { color: var(--text-secondary); }
        .tier-indicator.tier-mid   { color: var(--text-muted); }
        .tier-indicator.tier-low   { color: var(--text-muted); }

        /* Body */
        .char-card-body {
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        /* Tags row */
        .char-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .char-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .char-tag.element-fire { color: var(--element-fire-light); border-color: var(--element-fire); }
        .char-tag.element-ice { color: var(--element-ice-light); border-color: var(--element-ice); }
        .char-tag.element-electric { color: var(--element-electric-light); border-color: var(--element-electric); }
        .char-tag.element-physical { color: var(--element-physical-light); border-color: var(--element-physical); }
        .char-tag.element-ether { color: var(--element-ether-light); border-color: var(--element-ether); }
        .char-tag.element-wind { color: var(--element-wind-light); border-color: var(--element-wind); }

        /* Additional ability: compact stat-line */
        .char-ability-line {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .ability-label {
            font-weight: 600;
            color: var(--accent-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ability-reqs {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .ability-reqs .req {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Synergy body text */
        .char-synergy {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .char-synergy .unit-ref {
            color: var(--text-primary);
            font-weight: 700;
        }

        .char-synergy strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .char-synergy .mech-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Elemental coloring for mechanics text */
        .char-synergy .element-fire { color: var(--element-fire-light); }
        .char-synergy .element-ice { color: var(--element-ice-light); }
        .char-synergy .element-electric { color: var(--element-electric-light); }
        .char-synergy .element-physical { color: var(--element-physical-light); }
        .char-synergy .element-ether { color: var(--element-ether-light); }
        .char-synergy .element-wind { color: var(--element-wind-light); }

        .char-display-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-style: italic;
            line-height: 1.4;
        }

        /* Roster toggle — sized to match .dropdown-toggle */
        .roster-toggle {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
            padding: 0.7rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            transition: border-color 0.15s;
        }

        .roster-toggle:hover { border-color: var(--accent-primary); }

        .roster-toggle input { display: none; }

        .toggle-track {
            position: relative;
            width: 36px;
            height: 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .toggle-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }

        .roster-toggle input:checked ~ .toggle-track {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .roster-toggle input:checked ~ .toggle-track .toggle-thumb {
            transform: translateX(16px);
            background: var(--bg-primary);
        }

        .roster-toggle input:disabled ~ .toggle-track {
            opacity: 0.4;
        }

        .roster-toggle input:disabled ~ .toggle-label {
            opacity: 0.5;
        }

        .toggle-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Clear filters button */
        .clear-filters-btn {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.7rem 1rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            width: 100%;
        }

        .clear-filters-btn:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        /* States */
        .no-results-msg, .loading-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
        }
        .no-results-msg { color: var(--text-muted); }
        .loading-msg { color: var(--text-secondary); }

        @media (max-width: 768px) {
            .character-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container extra-wide">
        <div id="header-container"></div>

        <main>
            <details class="collapsible-filter" id="filter-section" open>
                <summary class="filter-header">
                    <h2>Filters</h2>
                    <span class="filter-toggle-hint">Filter by rank, element, role, or faction.</span>
                </summary>

                <div class="filters-grid">
                    <div class="filter-group">
                        <label class="filter-label">Rank</label>
                        <div class="multi-dropdown" data-filter="rank">
                            <button type="button" class="dropdown-toggle">
                                <span class="dropdown-text">Any Rank</span>
                                <span class="dropdown-arrow">▼</span>
                            </button>
                            <div class="dropdown-menu">
                                <label class="dropdown-item"><input type="checkbox" value="limited-s"> <span>Limited S</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="standard-s"> <span>Standard S</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="a-rank"> <span>A-Rank</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Element</label>
                        <div class="multi-dropdown" data-filter="element">
                            <button type="button" class="dropdown-toggle">
                                <span class="dropdown-text">Any Element</span>
                                <span class="dropdown-arrow">▼</span>
                            </button>
                            <div class="dropdown-menu">
                                <label class="dropdown-item"><input type="checkbox" value="fire"> <span class="element-tag fire">Fire</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="ice"> <span class="element-tag ice">Ice</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="electric"> <span class="element-tag electric">Electric</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="physical"> <span class="element-tag physical">Physical</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="ether"> <span class="element-tag ether">Ether</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="wind"> <span class="element-tag wind">Wind</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Role</label>
                        <div class="multi-dropdown" data-filter="role">
                            <button type="button" class="dropdown-toggle">
                                <span class="dropdown-text">Any Role</span>
                                <span class="dropdown-arrow">▼</span>
                            </button>
                            <div class="dropdown-menu">
                                <label class="dropdown-item"><input type="checkbox" value="attack"> <span>Attack</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="stun"> <span>Stun</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="anomaly"> <span>Anomaly</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="support"> <span>Support</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="defense"> <span>Defense</span></label>
                                <label class="dropdown-item"><input type="checkbox" value="rupture"> <span>Rupture</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Tier</label>
                        <div class="multi-dropdown" data-filter="tier">
                            <button type="button" class="dropdown-toggle">
                                <span class="dropdown-text">Any Tier</span>
                                <span class="dropdown-arrow">▼</span>
                            </button>
                            <div class="dropdown-menu" id="tier-menu"></div>
                        </div>
                    </div>

                    <div class="filter-group filter-group-wide">
                        <label class="filter-label">Faction</label>
                        <div class="multi-dropdown multi-dropdown-wide" data-filter="faction">
                            <button type="button" class="dropdown-toggle">
                                <span class="dropdown-text">Any Faction</span>
                                <span class="dropdown-arrow">▼</span>
                            </button>
                            <div class="dropdown-menu" id="faction-menu"></div>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">My Roster</label>
                        <label class="roster-toggle">
                            <input type="checkbox" id="owned-toggle">
                            <span class="toggle-track">
                                <span class="toggle-thumb"></span>
                            </span>
                            <span class="toggle-label" id="owned-hint">Owned only</span>
                        </label>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">&nbsp;</label>
                        <button type="button" class="clear-filters-btn" id="clear-filters">Clear Filters</button>
                    </div>
                </div>
            </details>

            <div class="summary-count" id="summary-count"></div>

            <div class="character-grid" id="character-grid">
                <div class="loading-msg">Loading character data...</div>
            </div>
        </main>

        <div id="footer-container"></div>
    </div>

    <script type="module">
        import { loadSharedComponents } from './lib/common/components.js';
        loadSharedComponents('character-summary');
    </script>
    <script type="module" src="lib/pages/character-summary.js"></script>
</body>
</html>
