<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ZZZ Tools - Interactive tools for Zenless Zone Zero players">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;family=Rajdhani:wght@400;500;600&amp;display=swap');</style>
    <linearGradient id="wordmark" gradientUnits="userSpaceOnUse" x1="215" y1="0" x2="985" y2="0">
      <stop offset="0" stop-color="#ff5a2a"/>
      <stop offset="0.38" stop-color="#f5b83a"/>
      <stop offset="0.62" stop-color="#9ad04a"/>
      <stop offset="1" stop-color="#1fc9a8"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="940" y2="0">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ff7a2f"/>
      <stop offset="0.5" stop-color="#f5b83a"/>
      <stop offset="0.8" stop-color="#1fc9a8"/>
      <stop offset="1" stop-color="#1fc9a8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#ff7a2f"/>
    </pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotMask"><rect width="520" height="260" fill="url(#dotFade)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="#0a0a10"/>
  <rect width="520" height="260" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- Triple-Z watermark: favicon.svg geometry and three-tone layering, scaled 6.5x, sitting inside the right edge -->
  <g opacity="0.16" transform="translate(780 190) scale(6.5)">
    <path d="M8 8 L56 8 L56 16 L8 48 L8 56 L56 56 L56 48 L24 48 L40 16 L8 16 Z" fill="#5a5a66" transform="translate(4 4)"/>
    <path d="M8 8 L56 8 L56 16 L8 48 L8 56 L56 56 L56 48 L24 48 L40 16 L8 16 Z" fill="#9a9aa8" transform="translate(2 2)"/>
    <path d="M8 8 L56 8 L56 16 L8 48 L8 56 L56 56 L56 48 L24 48 L40 16 L8 16 Z" fill="#ffffff"/>
  </g>

  <!-- Wordmark (x offset +2 cancels the trailing letter-spacing under text-anchor middle) -->
  <text x="602" y="170" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="108" font-weight="700"
        fill="url(#wordmark)" letter-spacing="4">ZZZ TOOLS</text>

  <rect x="260" y="200" width="680" height="3" fill="url(#rule)"/>

  <text x="600" y="265" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="46" font-weight="500" letter-spacing="1"
        fill="#c9c9d2">Interactive tools for Zenless Zone Zero players</text>

  <!-- What the site does: icon + short label; x positions give equal gaps between labels -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" font-family="Rajdhani, sans-serif" text-anchor="middle">
    <g transform="translate(252.5 410) scale(1.45)" stroke="#ff7a2f" fill="#ff7a2f">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="none"/>
      <circle cx="-14" cy="-14" r="4" stroke="none"/><circle cx="14" cy="-14" r="4" stroke="none"/>
      <circle cx="0" cy="0" r="4" stroke="none"/>
      <circle cx="-14" cy="14" r="4" stroke="none"/><circle cx="14" cy="14" r="4" stroke="none"/>
    </g>
    <text class="lbl" x="254.0" y="520" font-size="30" font-weight="600" letter-spacing="3" fill="#ff7a2f" stroke="none">GACHA ODDS</text>

    <g transform="translate(514.5 410) scale(1.45)" stroke="#2dd4bf">
      <line x1="0" y1="-18" x2="-24" y2="16"/><line x1="0" y1="-18" x2="24" y2="16"/><line x1="-24" y1="16" x2="24" y2="16"/>
      <circle cx="0" cy="-18" r="10" fill="#0a0a10"/><circle cx="-24" cy="16" r="10" fill="#0a0a10"/><circle cx="24" cy="16" r="10" fill="#0a0a10"/>
    </g>
    <text class="lbl" x="516.0" y="520" font-size="30" font-weight="600" letter-spacing="3" fill="#2dd4bf" stroke="none">TEAM BUILDER</text>

    <g transform="translate(762.5 410) scale(1.45)" stroke="#84cc16">
      <path d="M0,-34 C3,-12 12,-3 34,0 C12,3 3,12 0,34 C-3,12 -12,3 -34,0 C-12,-3 -3,-12 0,-34 Z" fill="#84cc16" fill-opacity="0.15"/>
    </g>
    <text class="lbl" x="764.0" y="520" font-size="30" font-weight="600" letter-spacing="3" fill="#84cc16" stroke="none">PULL RECS</text>

    <g transform="translate(972.5 410) scale(1.45)" stroke="none" fill="#a78bfa">
      <rect x="-30" y="-28" width="60" height="14" rx="3"/>
      <rect x="-30" y="-7" width="42" height="14" rx="3" fill-opacity="0.75"/>
      <rect x="-30" y="14" width="24" height="14" rx="3" fill-opacity="0.5"/>
    </g>
    <text class="lbl" x="974.0" y="520" font-size="30" font-weight="600" letter-spacing="3" fill="#a78bfa" stroke="none">TIER LIST</text>
  </g>
</svg>
