<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZZZ Pull Recommendations</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <!-- Pako compression library for roster sharing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
    <div class="container extra-wide">
        <div id="header-container"></div>

        <main>
            <section class="pull-intro-section">
                <p class="section-description">Analyze your roster to find the highest-impact limited S-rank characters to pull next. Recommendations are based on gaps in DPS archetype coverage, support ecosystem, stunner availability, and team synergies.</p>
            </section>

            <div id="roster-container"></div>

            <!-- Validation & Run -->
            <section class="action-section">
                <div id="validation-errors" class="validation-errors" style="display: none;"></div>
                <button id="run-btn" class="run-btn">Analyze Roster</button>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="results-section" style="display: none;">
                <div id="roster-assessment"></div>
                <div class="results-header">
                    <h3>Recommended Pulls</h3>
                </div>
                <div id="recommendations-list"></div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

    <script type="module">
        import { loadSharedComponents } from './lib/components.js';
        loadSharedComponents('pull-recommendations');
    </script>
    <script type="module" src="pull-recommendations.js"></script>
</body>
</html>
