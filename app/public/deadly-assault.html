    <title>ZZZ Deadly Assault Team Builder</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "WebApplication",
                "name": "ZZZ Deadly Assault Team Builder",
                "url": "https://njxaxson.github.io/zzz-utils/deadly-assault.html",
                "description": "Find optimal non-overlapping team allocations for three Deadly Assault bosses using your Zenless Zone Zero roster.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Any",
                "inLanguage": "en",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
                "about": {
                    "@type": "VideoGame",
                    "name": "Zenless Zone Zero",
                    "alternateName": "ZZZ",
                    "publisher": {
                        "@type": "Organization",
                        "name": "HoYoverse"
                    }
                },
                "author": {
                    "@type": "Person",
                    "name": "njxaxson"
                }
            },
            {
                "@type": "BreadcrumbList",
                "itemListElement": [
                    { "@type": "ListItem", "position": 1, "name": "ZZZ Utils", "item": "https://njxaxson.github.io/zzz-utils/" },
                    { "@type": "ListItem", "position": 2, "name": "Deadly Assault Team Builder", "item": "https://njxaxson.github.io/zzz-utils/deadly-assault.html" }
                ]
            }
        ]
    }

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

<body>
    <div class="container extra-wide">
        <div id="header-container"></div>

        <main>
            <!-- Boss Selection Section -->
            <section class="boss-selection-section">
                <h2>Select 3 Bosses</h2>
                <p class="section-description">Choose the three Deadly Assault bosses you want to build teams for.</p>
                <div class="boss-grid" id="boss-grid"></div>
                <p class="boss-variation-hint" id="boss-variation-hint" style="display:none">Bosses with a <span class="boss-variation-hint-dot">&#9679;</span> have alternate versions &mdash; right-click to cycle through them.</p>
            </section>

            <div id="roster-container"></div>

            <!-- Validation & Run -->
            <section class="action-section">
                <div id="validation-errors" class="validation-errors" style="display: none;"></div>
                <button id="run-btn" class="run-btn">Find Optimal Teams</button>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="results-section" style="display: none;">
                <div class="results-header">
                    <h2>Recommended Team Allocations</h2>
                    <label class="variations-checkbox">
                        <input type="checkbox" id="da-variations-checkbox">
                        Show variations
                    </label>
                </div>
                <div id="results-container"></div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

    <script type="module">
        import { loadSharedComponents } from './lib/common/components.js';
        loadSharedComponents('deadly-assault');
    </script>
    <script type="module" src="lib/pages/deadly-assault.js"></script>
